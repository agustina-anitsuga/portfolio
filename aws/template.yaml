AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  portfolio - dashboard online. CloudFront + S3 serve a login page (no data in
  it); the dashboard HTML is generated by a Lambda from the Google Drive
  spreadsheet and kept in a private bucket. See docs/aws-online.md.

  Naming rule: every resource that has a name starts with "portfolio", and
  every resource that accepts tags carries project=portfolio (deploy.sh also
  tags the stack, which CloudFormation propagates).

Parameters:
  AdminEmail:
    Type: String
    Description: Email of the only user (receives a temporary password).
  SheetId:
    Type: String
    Description: Google Drive ID of the portfolio spreadsheet.
  PpiParameter:
    Type: String
    Default: portfolio-ppi
    AllowedPattern: "^portfolio.*"
    Description: SecureString with {"public_key", "private_key"} of PPI.
  GoogleCredentialsParameter:
    Type: String
    Default: portfolio-google-credentials
    AllowedPattern: "^portfolio.*"
    Description: String with the Workload Identity Federation credentials config.

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Tags:
      project: portfolio
    PropagateTags: true

Resources:
  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "portfolio-data-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      Tags:
        - {Key: project, Value: portfolio}

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "portfolio-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      Tags:
        - {Key: project, Value: portfolio}

  # ------------------------------------------------------------- web page
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: portfolio-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: portfolio
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: portfolio-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: portfolio-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
      Tags:
        - {Key: project, Value: portfolio}
        - {Key: Name, Value: portfolio}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ---------------------------------------------------------------- login
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: portfolio-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      UserPoolTags:
        project: portfolio

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "portfolio-${AWS::AccountId}"
      ManagedLoginVersion: 2

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: portfolio-dashboard
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/"]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - {Name: email, Value: !Ref AdminEmail}
        - {Name: email_verified, Value: "true"}

  # ------------------------------------------------------------------ API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: portfolio-api
      Tags:
        project: portfolio
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: PortfolioCognito
        Authorizers:
          PortfolioCognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-api
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: portfolio-api
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket      # so a missing status.json is NoSuchKey, not AccessDenied
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkerFunction.Arn
      Tags:
        - {Key: project, Value: portfolio}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: portfolio-api
      CodeUri: ../.aws-build/api
      Handler: portfolio.cloud.api.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 256
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref ApiLogs
        LogFormat: Text
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          WORKER_FUNCTION: !Ref WorkerFunction
      Events:
        Status:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /status}
        Dashboard:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /dashboard}
        Refresh:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /refresh}

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: portfolio/lambda/api
      RetentionInDays: 14
      Tags:
        - {Key: project, Value: portfolio}

  # --------------------------------------------------------------- worker
  # Fixed role name: Google's Workload Identity Federation trusts exactly
  # this role (see aws/google-wif.sh), so it must not change between deploys.
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: portfolio-refresh-worker
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: portfolio-refresh-worker
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${PpiParameter}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${GoogleCredentialsParameter}"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Tags:
        - {Key: project, Value: portfolio}

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: portfolio-refresh
      CodeUri: ../.aws-build/worker
      Handler: portfolio.cloud.worker.handler
      Role: !GetAtt WorkerRole.Arn
      MemorySize: 1024
      Timeout: 900
      EphemeralStorage: {Size: 512}
      LoggingConfig:
        LogGroup: !Ref WorkerLogs
        LogFormat: Text
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          PORTFOLIO_SHEET_ID: !Ref SheetId
          PPI_PARAM: !Ref PpiParameter
          GOOGLE_CREDENTIALS_PARAM: !Ref GoogleCredentialsParameter
          XDG_CACHE_HOME: /tmp/cache   # yfinance keeps a cache; only /tmp is writable
      EventInvokeConfig:
        MaximumRetryAttempts: 0       # a failed run is reported, not retried behind the user's back

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: portfolio/lambda/refresh
      RetentionInDays: 14
      Tags:
        - {Key: project, Value: portfolio}

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}/"
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CognitoDomain:
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WorkerRoleName:
    Value: !Ref WorkerRole
